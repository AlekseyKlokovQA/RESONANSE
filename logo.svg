<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E7B9" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <linearGradient id="lavenderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="none" />

  <!-- Logo Mark / Emblem -->
  <g transform="translate(110, 120)">
    <!-- Ambient Resonance Rings -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#waveGlow)" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3" />
    
    <!-- Left Soundwave Arc (Gold) -->
    <path d="M -38 -45 C -10 -45, 30 -20, 30 15 C 30 40, -5 45, -20 25 C -35 5, -25 -20, 0 -35" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Right Soundwave Arc (Lavender/Violet) -->
    <path d="M 38 45 C 10 45, -30 20, -30 -15 C -30 -40, 5 -45, 20 -25 C 35 -5, 25 20, 0 35" 
          fill="none" stroke="url(#lavenderGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- Central Resonance Node (Intersection Spark) -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" filter="url(#glow)" />
    <circle cx="0" cy="0" r="9" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.8" />

    <!-- Harmonic Sound Wave Bars Inside -->
    <line x1="-48" y1="0" x2="-48" y2="0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y1" values="-6;-18;-6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="y2" values="6;18;6" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="-58" y1="0" x2="-58" y2="0" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
      <animate attributeName="y1" values="-3;-10;-3" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="3;10;3" dur="2.4s" repeatCount="indefinite" />
    </line>
    <line x1="48" y1="0" x2="48" y2="0" stroke="url(#lavenderGrad)" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y1" values="-18;-6;-18" dur="2s" repeatCount="indefinite" />
      <animate attributeName="y2" values="18;6;18" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="58" y1="0" x2="58" y2="0" stroke="url(#lavenderGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
      <animate attributeName="y1" values="-10;-3;-10" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="10;3;10" dur="2.4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Typography / Brand Name -->
  <g transform="translate(230, 115)">
    <!-- Main Title -->
    <text x="0" y="10" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="44" font-weight="700" letter-spacing="10" fill="#FFFFFF">
      RESONANCE
    </text>
    
    <!-- Accent Line -->
    <rect x="2" y="24" width="370" height="1.5" fill="url(#waveGlow)" />
    
    <!-- Subtitle / Positioning -->
    <text x="4" y="46" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="6" fill="#D4AF37">
      THE ANTI-SWIPE SOCIETY
    </text>

    <!-- Russian Micro-descriptor -->
    <text x="4" y="65" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="9" font-weight="400" letter-spacing="3" fill="#94A3B8" opacity="0.85">
      КЛУБ ОСОЗНАННЫХ ЗНАКОМСТВ • ГОЛОС И СВИДАНИЯ В ГОРОДЕ
    </text>
  </g>
</svg>
