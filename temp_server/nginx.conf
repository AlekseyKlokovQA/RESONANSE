events {
    worker_connections 32;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # =========================================================================
    # СТРОГОЕ ОГРАНИЧЕНИЕ: МАКСИМУМ 5 ОДНОВРЕМЕННЫХ ПОДКЛЮЧЕНИЙ ПО СЕТИ
    # =========================================================================
    limit_conn_zone $server_name zone=active_users_zone:10m;
    limit_conn_status 503;

    server {
        listen 3000;
        server_name _;

        # Применяем лимит 5 активных соединений
        limit_conn active_users_zone 5;

        root /usr/share/nginx/html;
        index index.html;

        # Разрешаем Range-запросы для стриминга аудиофайлов .mp3
        location ~* \.(mp3|ogg|wav)$ {
            add_header Accept-Ranges bytes;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Кастомная страница при превышении 5 пользователей (HTTP 503)
        error_page 503 /limit_exceeded.html;
        location = /limit_exceeded.html {
            internal;
            root /usr/share/nginx/html;
        }
    }
}
