services:
  resonance-temp-server:
    image: nginx:alpine
    container_name: resonance_test_5users
    restart: "no"
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../:/usr/share/nginx/html:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
